limit_req_zone $binary_remote_addr zone=staffdeck_preview_login:10m rate=10r/m;

server {
    listen 80;
    listen [::]:80;
    server_name preview.agentteam.neospark.cn;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/staffdeck-preview-acme;
        default_type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name preview.agentteam.neospark.cn;

    ssl_certificate /etc/letsencrypt/live/preview.agentteam.neospark.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/preview.agentteam.neospark.cn/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    access_log /var/log/nginx/staffdeck-preview.access.log;
    error_log /var/log/nginx/staffdeck-preview.error.log;

    client_max_body_size 100m;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header X-Frame-Options SAMEORIGIN always;

    location = /api/auth/login {
        limit_req zone=staffdeck_preview_login burst=5 nodelay;
        proxy_pass http://127.0.0.1:18173;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 650s;
        proxy_send_timeout 650s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location / {
        proxy_pass http://127.0.0.1:18173;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 650s;
        proxy_send_timeout 650s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
