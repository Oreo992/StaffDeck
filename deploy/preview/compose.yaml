name: staffdeck-preview

services:
  app:
    container_name: staffdeck-preview
    image: staffdeck-preview:${STAFFDECK_IMAGE_TAG:-local}
    build:
      context: ../..
      dockerfile: deploy/preview/Dockerfile
      args:
        NODE_IMAGE: ${NODE_IMAGE:-docker.m.daocloud.io/library/node:22-bookworm-slim}
        PYTHON_IMAGE: ${PYTHON_IMAGE:-docker.m.daocloud.io/library/python:3.11-slim}
    restart: unless-stopped
    env_file:
      - /data/staffdeck-preview/backend.env
    environment:
      ULTRARAG_DATA_DIR: /data
      DATABASE_URL: sqlite:////data/staffdeck.db
      TOOL_BASE_URL: https://preview.agentteam.neospark.cn
      CORS_ORIGINS: https://preview.agentteam.neospark.cn
      GENERAL_SKILL_RUNTIME_VENV: /data/general-skill-venv
      GENERAL_SKILL_NETWORK_INSTALL: "false"
    extra_hosts:
      - host.docker.internal:host-gateway
    ports:
      - 127.0.0.1:18173:5173
    volumes:
      - /data/staffdeck-preview/app:/data
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 512
    mem_limit: 2g
    cpus: 2.0
    stop_grace_period: 30s
