<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1.0" />
<title>__TITLE__</title>
<link rel="preconnect" href="https://rsms.me/" />
<link rel="stylesheet" href="https://rsms.me/inter/inter.css" />
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
<style>
  :root {
    /* Surface */
    --bg:          #fafbfc;
    --surface:     #ffffff;
    --surface-2:   #f6f7f9;

    /* Lines & borders */
    --border:      #eaecef;
    --border-strong:#d0d7de;

    /* Text */
    --text-1:      #1f2328;
    --text-2:      #57606a;
    --text-3:      #8b949e;

    /* Brand */
    --brand:       #2563eb;
    --brand-soft:  #eff6ff;

    /* Status (used sparingly) */
    --good:        #16a34a;
    --good-soft:   #dcfce7;
    --warn:        #d97706;
    --warn-soft:   #fef3c7;
    --bad:         #dc2626;
    --bad-soft:    #fee2e2;
    --neutral-soft:#f0f1f3;

    /* Elevation */
    --shadow-1:    0 1px 2px rgba(15,23,42,.04), 0 1px 1px rgba(15,23,42,.03);
    --shadow-2:    0 1px 3px rgba(15,23,42,.06), 0 1px 2px rgba(15,23,42,.04);

    --radius:      10px;
    --radius-sm:   6px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { background: var(--bg); }
  body {
    font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    color: var(--text-1);
    line-height: 1.55;
    padding: 40px 32px 64px;
    font-feature-settings: "cv11", "ss01", "tnum";
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 1240px; margin: 0 auto; }

  /* ── HEADER ───────────────────────────────────────── */
  .header {
    margin-bottom: 32px;
    padding-bottom: 24px;
    border-bottom: 1px solid var(--border);
  }
  .header .eyebrow {
    font-size: 12px;
    font-weight: 500;
    letter-spacing: .08em;
    text-transform: uppercase;
    color: var(--text-3);
    margin-bottom: 10px;
  }
  .header h1 {
    font-size: 28px;
    font-weight: 600;
    letter-spacing: -0.01em;
    color: var(--text-1);
    margin-bottom: 6px;
  }
  .header .subtitle {
    font-size: 15px;
    color: var(--text-2);
    font-weight: 400;
  }
  .header .meta {
    display: flex;
    gap: 20px;
    margin-top: 16px;
    font-size: 12px;
    color: var(--text-3);
  }
  .header .meta span { display: inline-flex; align-items: center; gap: 6px; }
  .header .meta .dot {
    width: 4px; height: 4px; border-radius: 50%;
    background: var(--text-3); display: inline-block;
  }

  /* ── KPI ──────────────────────────────────────────── */
  .kpi-row {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 12px;
    margin-bottom: 32px;
  }
  .kpi-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 18px 20px;
    box-shadow: var(--shadow-1);
    position: relative;
  }
  .kpi-card .label {
    font-size: 12px;
    color: var(--text-2);
    font-weight: 500;
    margin-bottom: 8px;
  }
  .kpi-card .value {
    font-size: 26px;
    font-weight: 600;
    color: var(--text-1);
    line-height: 1.2;
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.01em;
  }
  .kpi-card .delta {
    font-size: 12px;
    color: var(--text-3);
    margin-top: 6px;
    display: inline-flex;
    align-items: center;
    gap: 4px;
  }
  .kpi-card .delta.up   { color: var(--good); }
  .kpi-card .delta.down { color: var(--bad); }
  /* 视觉强调（agent 用 tone / emphasis 标记重要 KPI） */
  .kpi-card.tone-brand   { background: var(--brand-soft); border-color: var(--brand);  }
  .kpi-card.tone-brand   .value { color: var(--brand); }
  .kpi-card.tone-good    { background: var(--good-soft);  border-color: var(--good); }
  .kpi-card.tone-good    .value { color: var(--good); }
  .kpi-card.tone-warn    { background: var(--warn-soft);  border-color: var(--warn); }
  .kpi-card.tone-warn    .value { color: var(--warn); }
  .kpi-card.tone-bad     { background: var(--bad-soft);   border-color: var(--bad); }
  .kpi-card.tone-bad     .value { color: var(--bad); }
  .kpi-card.size-lg .value { font-size: 32px; }
  .kpi-card.size-xl .value { font-size: 40px; line-height: 1.1; }
  /* 趋势指示器（小三角，避免误用文字） */
  .kpi-card .trend {
    display: inline-block;
    margin-right: 4px;
    font-size: 0.9em;
  }
  .kpi-card .trend.up::before   { content: '▲'; color: var(--good); }
  .kpi-card .trend.down::before { content: '▼'; color: var(--bad); }
  .kpi-card .trend.flat::before { content: '◆'; color: var(--text-3); }

  /* ── SECTIONS ─────────────────────────────────────── */
  .section {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 24px 28px;
    margin-bottom: 24px;
    box-shadow: var(--shadow-1);
  }
  .section-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 20px;
    gap: 16px;
  }
  .section-head h2 {
    font-size: 16px;
    font-weight: 600;
    color: var(--text-1);
    letter-spacing: -0.005em;
  }
  .section-head .lede {
    font-size: 13px;
    color: var(--text-3);
    font-weight: 400;
    text-align: right;
    max-width: 60%;
  }

  /* ── DIRECTION CARDS ──────────────────────────────── */
  .card-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 12px;
  }
  .dir-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 18px 20px;
    position: relative;
    transition: border-color .15s ease, box-shadow .15s ease;
  }
  .dir-card:hover {
    border-color: var(--border-strong);
    box-shadow: var(--shadow-2);
  }
  .dir-card.is-pick {
    border-color: var(--brand);
    background: linear-gradient(180deg, var(--brand-soft) 0%, var(--surface) 60%);
  }
  .dir-card .badge {
    position: absolute;
    top: 14px;
    right: 14px;
    background: var(--brand);
    color: #fff;
    font-size: 11px;
    font-weight: 500;
    padding: 3px 8px;
    border-radius: 999px;
    letter-spacing: 0.02em;
  }
  .dir-card h3 {
    font-size: 15px;
    font-weight: 600;
    margin-bottom: 12px;
    color: var(--text-1);
    padding-right: 60px;
  }
  .dir-card .features {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin: 0 0 12px;
  }
  .dir-card .features span {
    background: var(--neutral-soft);
    color: var(--text-2);
    font-size: 11px;
    font-weight: 500;
    padding: 3px 9px;
    border-radius: 999px;
  }
  .dir-card .meta {
    font-size: 13px;
    color: var(--text-2);
    margin: 4px 0;
    line-height: 1.55;
  }
  .dir-card .meta-label {
    color: var(--text-3);
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    margin-right: 6px;
    font-weight: 500;
  }
  .dir-card .reason {
    font-size: 13px;
    color: var(--text-1);
    background: var(--surface-2);
    padding: 10px 12px;
    border-radius: var(--radius-sm);
    margin-top: 12px;
    border: 1px solid var(--border);
    line-height: 1.6;
  }

  /* ── CHARTS ───────────────────────────────────────── */
  .chart-row {
    display: grid;
    grid-template-columns: 1fr;
    gap: 16px;
  }
  .chart-row.two-col   { grid-template-columns: 1fr 1fr; }
  .chart-row.three-col { grid-template-columns: 1fr 1fr 1fr; }
  @media (max-width: 900px) {
    .chart-row.two-col,
    .chart-row.three-col { grid-template-columns: 1fr; }
  }
  .chart-cell {
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px 18px 12px;
    min-height: 300px;
  }
  .chart-cell h4 {
    font-size: 13px;
    color: var(--text-2);
    font-weight: 500;
    margin-bottom: 8px;
  }
  .chart-cell .chart { width: 100%; height: 280px; }

  /* ── TABLES ───────────────────────────────────────── */
  .table-wrap {
    overflow-x: auto;
    border: 1px solid var(--border);
    border-radius: var(--radius);
  }
  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13.5px;
  }
  thead th {
    background: var(--surface-2);
    padding: 11px 16px;
    text-align: left;
    color: var(--text-2);
    font-weight: 500;
    font-size: 12px;
    letter-spacing: 0.02em;
    border-bottom: 1px solid var(--border);
    white-space: nowrap;
  }
  tbody td {
    padding: 12px 16px;
    color: var(--text-1);
    border-bottom: 1px solid var(--border);
    vertical-align: middle;
  }
  tbody tr:last-child td { border-bottom: none; }
  tbody tr:hover td { background: var(--surface-2); }

  .tag {
    display: inline-flex;
    align-items: center;
    padding: 3px 11px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.01em;
    line-height: 1.5;
  }
  .tag.good    { background: var(--good-soft);    color: var(--good); }
  .tag.bad     { background: var(--bad-soft);     color: var(--bad); }
  .tag.warn    { background: var(--warn-soft);    color: var(--warn); }
  .tag.brand   { background: var(--brand-soft);   color: var(--brand); }
  .tag.neutral { background: var(--neutral-soft); color: var(--text-2); }
  /* legacy color aliases for backwards-compat */
  .tag.green  { background: var(--good-soft);    color: var(--good); }
  .tag.red    { background: var(--bad-soft);     color: var(--bad); }
  .tag.yellow { background: var(--warn-soft);    color: var(--warn); }
  .tag.blue   { background: var(--brand-soft);   color: var(--brand); }
  .tag.gray   { background: var(--neutral-soft); color: var(--text-2); }
  /* 表格里：结论列加重 + 行级 hover 高亮重点 */
  table .conclusion {
    color: var(--brand);
    font-weight: 600;
  }
  table tr.is-winner td { background: var(--brand-soft); }
  table tr.is-winner td:first-child::before {
    content: '★ ';
    color: var(--brand);
    font-weight: 700;
  }

  /* ── DECISIONS ────────────────────────────────────── */
  .decisions { display: flex; flex-direction: column; gap: 10px; }
  .decision {
    display: flex;
    gap: 14px;
    align-items: flex-start;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px 18px;
  }
  .decision .num {
    flex: 0 0 28px;
    height: 28px;
    border-radius: 50%;
    background: var(--brand-soft);
    color: var(--brand);
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 600;
    font-size: 13px;
    font-variant-numeric: tabular-nums;
  }
  .decision .body { flex: 1; min-width: 0; }
  .decision .body h4 {
    font-size: 14px;
    font-weight: 600;
    color: var(--text-1);
    margin-bottom: 3px;
  }
  .decision .body p {
    font-size: 13px;
    color: var(--text-2);
    line-height: 1.6;
  }
  .decision .body .when {
    display: inline-block;
    font-size: 11px;
    color: var(--text-3);
    margin-top: 8px;
    padding: 2px 8px;
    background: var(--surface-2);
    border-radius: var(--radius-sm);
    font-weight: 500;
    letter-spacing: 0.02em;
    text-transform: uppercase;
  }

  /* ── PRODUCT GRID (Amazon-specific) ───────────────── */
  .product-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 14px;
  }
  .product-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    transition: border-color .15s ease, box-shadow .15s ease, transform .15s ease;
    position: relative;
    color: inherit;
    text-decoration: none;
  }
  a.product-card { cursor: pointer; display: flex; }
  .product-card:hover {
    border-color: var(--brand);
    box-shadow: 0 6px 20px rgba(37, 99, 235, 0.10), 0 2px 6px rgba(15, 23, 42, 0.06);
    transform: translateY(-2px);
  }
  .product-card:hover .title { color: var(--brand); }
  .product-card .ext-icon {
    display: none;
  }
  .product-card .amz-cta {
    position: absolute;
    right: 10px;
    bottom: 10px;
    z-index: 3;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: rgba(37, 99, 235, .94);
    color: #fff;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: .02em;
    padding: 6px 9px;
    border-radius: 999px;
    box-shadow: 0 6px 18px rgba(37, 99, 235, .24);
    text-decoration: none;
    opacity: 0;
    pointer-events: none;
    transform: translateY(4px);
    transition: opacity .15s ease, transform .15s ease;
  }
  .product-card:hover .amz-cta,
  .product-card:focus-within .amz-cta {
    opacity: 1;
    pointer-events: auto;
    transform: translateY(0);
  }
  .product-card .amz-cta:hover {
    background: #1d4ed8;
    color: #fff;
  }
  .product-card .amz-cta-icon {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: rgba(255,255,255,.18);
  }
  /* 自动高亮（数据对比） */
  .product-card.has-best-sales .monthly-sales { background: var(--brand); color: #fff; box-shadow: 0 0 0 3px rgba(37,99,235,.12); }
  .product-card.has-best-rating .stars { color: #ea580c; font-weight: 600; }
  .product-card.has-best-price .price { color: var(--good); }
  .product-card .crown {
    position: absolute;
    top: -8px; right: -8px;
    width: 32px; height: 32px;
    background: var(--brand);
    border-radius: 50%;
    display: none;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    color: #fff;
    box-shadow: 0 4px 10px rgba(37,99,235,.35);
    z-index: 2;
  }
  .product-card.has-best-sales .crown { display: flex; }
  .product-card .img-wrap {
    position: relative;
    width: 100%;
    aspect-ratio: 1;
    background: var(--surface-2);
    border-radius: var(--radius-sm);
    overflow: hidden;
  }
  /* placeholder 永远在背景，img 失败时 hide 自己后 placeholder 露出 */
  .product-card .img-wrap .placeholder {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 32px;
    color: var(--text-3);
    opacity: .5;
    z-index: 0;
  }
  .product-card .img-wrap img {
    position: relative;
    width: 100%;
    height: 100%;
    object-fit: contain;
    background: #fff;
    z-index: 1;
  }
  .product-card .rank {
    position: absolute;
    top: 8px; left: 8px;
    background: rgba(15,23,42,.75);
    color: #fff;
    font-size: 11px;
    font-weight: 600;
    padding: 2px 8px;
    border-radius: 999px;
    letter-spacing: .02em;
  }
  .product-card .badges {
    position: absolute;
    top: 8px; right: 8px;
    display: flex;
    flex-direction: column;
    gap: 4px;
    align-items: flex-end;
  }
  .badge-amz {
    font-size: 10px;
    font-weight: 600;
    padding: 2px 7px;
    border-radius: var(--radius-sm);
    letter-spacing: .03em;
    text-transform: uppercase;
  }
  .badge-amz.best-seller   { background: #f59e0b; color: #fff; }
  .badge-amz.amazon-choice { background: #14532d; color: #fff; }
  .badge-amz.new-release   { background: #2563eb; color: #fff; }
  .product-card .title {
    font-size: 13px;
    color: var(--text-1);
    font-weight: 500;
    line-height: 1.4;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
    min-height: 2.8em;
  }
  .product-card .brand {
    font-size: 11px;
    color: var(--text-3);
    text-transform: uppercase;
    letter-spacing: .04em;
    font-weight: 500;
  }
  .product-card .price-row {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 8px;
  }
  .product-card .price {
    font-size: 18px;
    font-weight: 600;
    color: var(--text-1);
    font-variant-numeric: tabular-nums;
  }
  .product-card .bsr {
    font-size: 11px;
    color: var(--text-3);
    font-variant-numeric: tabular-nums;
  }
  .product-card .stars {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    color: var(--text-2);
    font-variant-numeric: tabular-nums;
  }
  .star-svg {
    display: inline-flex;
    width: 76px;
    height: 14px;
    position: relative;
  }
  .star-svg .empty,
  .star-svg .filled {
    position: absolute;
    top: 0; left: 0;
    height: 14px;
    background-repeat: repeat-x;
    background-size: 16px 14px;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='16' height='14' viewBox='0 0 16 14'><path d='M8 1l2 4.6 5 .5-3.8 3.3 1.2 4.9L8 11.7 3.6 14.3l1.2-4.9L1 6.1l5-.5L8 1z' fill='%23d0d7de'/></svg>");
  }
  .star-svg .filled {
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='16' height='14' viewBox='0 0 16 14'><path d='M8 1l2 4.6 5 .5-3.8 3.3 1.2 4.9L8 11.7 3.6 14.3l1.2-4.9L1 6.1l5-.5L8 1z' fill='%23f59e0b'/></svg>");
  }
  .product-card .breadcrumb {
    font-size: 11px;
    color: var(--text-3);
    line-height: 1.5;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .product-card .breadcrumb .sep { color: var(--text-3); padding: 0 4px; }
  .product-card .meta-row {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    font-size: 11px;
    color: var(--text-3);
  }
  .product-card .meta-row span {
    background: var(--surface-2);
    padding: 2px 7px;
    border-radius: var(--radius-sm);
    font-weight: 500;
  }
  .product-card .meta-row .monthly-sales {
    background: var(--brand-soft);
    color: var(--brand);
    font-weight: 600;
  }
  /* legacy .links 已被整卡跳转 + .ext-icon hover 提示替代，保留向后兼容 */
  .product-card .links {
    margin-top: auto;
    padding-top: 8px;
    border-top: 1px solid var(--border);
    display: flex;
    gap: 8px;
    font-size: 11px;
  }
  .product-card .links a {
    color: var(--brand);
    text-decoration: none;
    font-weight: 500;
  }
  .product-card .links a:hover { text-decoration: underline; }

  /* ── MULTI-SOURCE COMPARISON ──────────────────────── */
  .multisource-wrap {
    overflow-x: auto;
    border: 1px solid var(--border);
    border-radius: var(--radius);
  }
  .multisource-wrap table { font-size: 13px; }
  .multisource-wrap .source-col {
    text-align: right;
    font-variant-numeric: tabular-nums;
    color: var(--text-1);
    font-weight: 500;
  }
  .multisource-wrap .source-col.empty { color: var(--text-3); font-weight: 400; }
  .multisource-wrap .source-col .asof {
    display: block;
    font-size: 11px;
    color: var(--text-3);
    font-weight: 400;
    margin-top: 2px;
  }
  .multisource-wrap .note {
    color: var(--text-2);
    font-size: 12px;
    line-height: 1.5;
    max-width: 380px;
  }
  .source-tag {
    display: inline-block;
    font-size: 10px;
    font-weight: 600;
    padding: 1px 6px;
    border-radius: var(--radius-sm);
    margin-right: 6px;
    letter-spacing: .04em;
    text-transform: uppercase;
  }
  .source-tag.ss        { background: #dbeafe; color: #1e40af; }
  .source-tag.justone   { background: #dcfce7; color: #14532d; }
  .source-tag.sorftime  { background: #fef3c7; color: #92400e; }
  .source-tag.keepa     { background: #fce7f3; color: #9d174d; }

  /* ── NARRATIVE (markdown-ish 自由段) ──────────────── */
  .narrative {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 24px 28px;
    margin-bottom: 24px;
    box-shadow: var(--shadow-1);
  }
  .narrative h2 {
    font-size: 16px;
    font-weight: 600;
    color: var(--text-1);
    letter-spacing: -0.005em;
    margin-bottom: 14px;
  }
  .narrative .lede {
    font-size: 13px;
    color: var(--text-3);
    margin-bottom: 14px;
  }
  .narrative .md { font-size: 14px; color: var(--text-1); line-height: 1.7; }
  .narrative .md p          { margin-bottom: 10px; }
  .narrative .md p:last-child { margin-bottom: 0; }
  .narrative .md > p:first-child {
    font-size: 15px;
    line-height: 1.7;
    color: var(--text-1);
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 12px 14px;
    margin-bottom: 14px;
  }
  .narrative .md h3,
  .narrative .md h4 {
    font-size: 13px;
    font-weight: 600;
    color: var(--text-1);
    margin-bottom: 8px;
  }
  .narrative .md ul,
  .narrative .md ol         { padding-left: 22px; margin-bottom: 10px; color: var(--text-1); }
  .narrative .md li         { margin-bottom: 4px; }
  .narrative .md strong     { color: var(--text-1); font-weight: 600; }
  .narrative .md em         { color: var(--text-2); }
  .narrative .md code       { background: var(--surface-2); padding: 1px 6px; border-radius: 4px; font-size: 0.92em; font-family: SFMono-Regular, Menlo, Consolas, monospace; }
  .narrative .md blockquote {
    border: 1px solid color-mix(in srgb, var(--brand) 28%, var(--border));
    padding: 4px 14px;
    color: var(--text-2);
    background: var(--brand-soft);
    border-radius: var(--radius-sm);
    margin: 10px 0;
    font-style: normal;
  }
  .narrative .md hr { border: none; border-top: 1px solid var(--border); margin: 16px 0; }
  .narrative .md a  { color: var(--brand); text-decoration: none; }
  .narrative .md a:hover { text-decoration: underline; }
  /* narrative 内嵌 2 列 / 3 列 grid（agent 可写 ::: cols 2 ... :::） */
  .narrative .cols-2,
  .narrative .cols-3 { display: grid; gap: 16px; margin-top: 12px; }
  .narrative .cols-2 { grid-template-columns: 1fr 1fr; }
  .narrative .cols-3 { grid-template-columns: 1fr 1fr 1fr; }
  .narrative .md-panel {
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px 16px;
  }
  .narrative .md-panel h4 {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    margin-bottom: 10px;
  }
  .narrative .md-panel ul,
  .narrative .md-panel ol { margin-bottom: 0; }
  @media (max-width: 900px) {
    .narrative .cols-2,
    .narrative .cols-3 { grid-template-columns: 1fr; }
  }

  /* ── CALLOUT (info / success / warn / danger) ──── */
  .callout {
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px 18px;
    margin-bottom: 16px;
    background: var(--surface);
  }
  .callout.info    { border-color: color-mix(in srgb, var(--brand) 45%, var(--border)); background: var(--brand-soft); }
  .callout.success { border-color: color-mix(in srgb, var(--good) 45%, var(--border));  background: var(--good-soft); }
  .callout.warn    { border-color: color-mix(in srgb, var(--warn) 45%, var(--border));  background: var(--warn-soft); }
  .callout.danger  { border-color: color-mix(in srgb, var(--bad) 45%, var(--border));   background: var(--bad-soft); }
  .callout .callout-title {
    font-size: 13px;
    font-weight: 600;
    color: var(--text-1);
    margin-bottom: 4px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .callout .callout-body {
    font-size: 13.5px;
    color: var(--text-1);
    line-height: 1.6;
  }

  /* ── INSIGHT STACK (发现 / 证据 / 含义 / 动作) ─── */
  .insight-stack {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
    gap: 12px;
  }
  .insight-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px 18px;
  }
  .insight-card .insight-top {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    align-items: flex-start;
    margin-bottom: 10px;
  }
  .insight-card h3 {
    font-size: 14px;
    font-weight: 600;
    color: var(--text-1);
    line-height: 1.4;
  }
  .insight-card .confidence {
    flex: 0 0 auto;
    font-size: 11px;
    color: var(--text-3);
    background: var(--surface-2);
    border-radius: 999px;
    padding: 2px 8px;
  }
  .insight-card dl {
    display: grid;
    grid-template-columns: 52px 1fr;
    gap: 7px 10px;
    font-size: 13px;
    line-height: 1.55;
  }
  .insight-card dt {
    color: var(--text-3);
    font-weight: 500;
  }
  .insight-card dd {
    color: var(--text-1);
    min-width: 0;
  }
  .insight-card.tone-good { background: var(--good-soft); border-color: color-mix(in srgb, var(--good) 45%, var(--border)); }
  .insight-card.tone-warn { background: var(--warn-soft); border-color: color-mix(in srgb, var(--warn) 45%, var(--border)); }
  .insight-card.tone-bad  { background: var(--bad-soft);  border-color: color-mix(in srgb, var(--bad) 45%, var(--border)); }

  /* ── SCORECARD (加权方案评分) ─────────────────── */
  .score-bar {
    display: inline-flex;
    width: 92px;
    height: 6px;
    border-radius: 999px;
    background: var(--neutral-soft);
    overflow: hidden;
    vertical-align: middle;
    margin-left: 8px;
  }
  .score-bar span {
    display: block;
    height: 100%;
    background: var(--brand);
    border-radius: 999px;
  }
  .score-stars {
    display: inline-flex;
    align-items: center;
    gap: 1px;
    font-size: 14px;
    letter-spacing: 0;
    white-space: nowrap;
  }
  .score-stars .on { color: var(--good); }
  .score-stars .off { color: #d0d7de; }
  .score-stars.tone-warn .on { color: var(--warn); }
  .score-stars.tone-bad .on { color: var(--bad); }
  .score-rank {
    display: inline-flex;
    width: 22px;
    height: 22px;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
    background: var(--surface-2);
    color: var(--text-2);
    font-size: 11px;
    font-weight: 600;
    margin-right: 8px;
  }
  tr.score-winner td { background: var(--brand-soft); }
  tr.score-winner .score-rank { background: var(--brand); color: #fff; }

  /* ── RISK MAP (影响 x 概率) ───────────────────── */
  .risk-map {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }
  .risk-quadrant {
    min-height: 150px;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px;
  }
  .risk-quadrant h3 {
    font-size: 12px;
    color: var(--text-2);
    font-weight: 600;
    margin-bottom: 10px;
  }
  .risk-item {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 10px 12px;
    margin-bottom: 8px;
  }
  .risk-item:last-child { margin-bottom: 0; }
  .risk-item .risk-title {
    display: flex;
    justify-content: space-between;
    gap: 10px;
    font-size: 13px;
    font-weight: 600;
    color: var(--text-1);
    margin-bottom: 4px;
  }
  .risk-item p {
    font-size: 12px;
    color: var(--text-2);
    line-height: 1.55;
  }
  .risk-item.tone-good { border-color: color-mix(in srgb, var(--good) 45%, var(--border)); }
  .risk-item.tone-warn { border-color: color-mix(in srgb, var(--warn) 45%, var(--border)); }
  .risk-item.tone-bad  { border-color: color-mix(in srgb, var(--bad) 45%, var(--border)); }
  @media (max-width: 760px) {
    .risk-map { grid-template-columns: 1fr; }
  }

  /* ── ROADMAP (阶段计划 / 时间线) ───────────────── */
  .roadmap {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
    gap: 12px;
  }
  .roadmap-step {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px 18px;
    position: relative;
  }
  .roadmap-step .period {
    font-size: 11px;
    color: var(--brand);
    font-weight: 600;
    margin-bottom: 8px;
    text-transform: uppercase;
    letter-spacing: .04em;
  }
  .roadmap-step h3 {
    font-size: 14px;
    font-weight: 600;
    color: var(--text-1);
    margin-bottom: 6px;
  }
  .roadmap-step p {
    font-size: 13px;
    color: var(--text-2);
    line-height: 1.6;
  }
  .roadmap-step .roadmap-meta {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-top: 10px;
  }

  /* ── SOURCE NOTES (口径 / 缺口 / 可信度) ──────── */
  .source-notes {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    gap: 12px;
  }
  .source-note {
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px 16px;
  }
  .source-note h3 {
    font-size: 13px;
    font-weight: 600;
    color: var(--text-1);
    margin-bottom: 6px;
  }
  .source-note p {
    font-size: 12.5px;
    color: var(--text-2);
    line-height: 1.6;
  }
  .source-note .note-meta {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-top: 10px;
  }

  /* ── QUOTE WALL (买家心声 / 评论引用) ───────── */
  .quote-wall {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 12px;
  }
  .quote-card {
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px 16px;
    position: relative;
  }
  .quote-card.tone-good { border-color: color-mix(in srgb, var(--good) 45%, var(--border)); background: var(--good-soft); }
  .quote-card.tone-bad  { border-color: color-mix(in srgb, var(--bad) 45%, var(--border));  background: var(--bad-soft); }
  .quote-card.tone-warn { border-color: color-mix(in srgb, var(--warn) 45%, var(--border)); background: var(--warn-soft); }
  .quote-card .quote-text {
    font-size: 13.5px;
    color: var(--text-1);
    line-height: 1.6;
    margin-bottom: 8px;
  }
  .quote-card .quote-text::before { content: '\201C'; color: var(--text-3); font-size: 22px; line-height: 0; vertical-align: -8px; margin-right: 2px; }
  .quote-card .quote-text::after  { content: '\201D'; color: var(--text-3); font-size: 22px; line-height: 0; vertical-align: -8px; margin-left: 2px; }
  .quote-card .quote-meta {
    font-size: 11px;
    color: var(--text-3);
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    align-items: center;
  }
  .quote-card .quote-meta .author { font-weight: 500; color: var(--text-2); }
  .quote-card .quote-stars {
    color: #f59e0b;
    letter-spacing: 1px;
    font-size: 11px;
  }

  /* ── DIVIDER ─────────────────────────────────────── */
  .block-divider {
    border: none;
    border-top: 1px dashed var(--border-strong);
    margin: 4px 0 20px;
  }
  .block-divider-label {
    display: inline-block;
    margin-left: 12px;
    padding: 0 8px;
    background: var(--bg);
    color: var(--text-3);
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    transform: translateY(-9px);
  }

  /* ── FOOTER ───────────────────────────────────────── */
  .footer {
    margin-top: 24px;
    padding-top: 20px;
    border-top: 1px solid var(--border);
    color: var(--text-3);
    font-size: 12px;
    display: flex;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
  }
</style>
</head>

    xAxis:     { type: 'value', ...baseAxis() },
    yAxis:     { type: 'category', data: data.map(p => p.name), ...baseAxis(),
      axisLabel: { color: '#1f2328', fontSize: 12, fontFamily: 'inherit' }},
    series:    [{
      type: 'bar', barWidth: '55%',
      data: data.map((p, i) => ({
        value: p.value ?? p.v ?? 0,
        itemStyle: { color: i === 0 ? '#16a34a' : '#cbd5e1', borderRadius: [0, 4, 4, 0] },
      })),
      label: { show: true, position: 'right', color: '#57606a', fontSize: 11, fontFamily: 'inherit',
        formatter: labelFmt || '{c}' },
      markLine: targetValue != null ? {
        symbol: 'none',
        data: [{ xAxis: targetValue, label: { color: '#dc2626', fontSize: 10,
          formatter: targetLabel || ('目标 ' + targetValue), position: 'end' }}],
        lineStyle: { color: '#dc2626', type: 'dashed', width: 1 },
      } : undefined,
    }],
  });
  const buildScatter = (data, xName, yName) => ({
    textStyle: { fontFamily: 'inherit' },
    tooltip: { ...baseTooltip(), formatter: p => {
      const d = p.data || {};
      const v = d.value || [];
      return '<b>' + esc(d.name || '') + '</b><br/>' +
        esc(xName || 'X') + ': ' + esc(v[0] ?? '') + '<br/>' +
        esc(yName || 'Y') + ': ' + esc(v[1] ?? '') +
        (v[2] != null ? '<br/>Size: ' + esc(v[2]) : '');
    }},
    grid: { left: 46, right: 24, top: 28, bottom: 42, containLabel: true },
    xAxis: { name: xName || '', nameTextStyle: { color: '#57606a' }, type: 'value', ...baseAxis() },
    yAxis: { name: yName || '', nameTextStyle: { color: '#57606a' }, type: 'value', ...baseAxis() },
    series: [{
      type: 'scatter',
      symbolSize: d => Math.max(10, Math.min(42, Math.sqrt(Number(d[2] || 16)) * 2)),
      itemStyle: { color: '#2563eb', opacity: .68, borderColor: '#1d4ed8', borderWidth: 1 },
      label: { show: true, formatter: d => d.data.name, color: '#1f2328', fontSize: 11, fontFamily: 'inherit', position: 'top' },
      data: data.map(p => ({
        name: p.name || p.label || '',
        value: Array.isArray(p.value) ? p.value : [Number(p.x) || 0, Number(p.y) || 0, Number(p.size || p.v || p.value) || 16],
      })),
    }],
  });
  const buildRadar = (data, indicators) => {
    const inferred = indicators && indicators.length ? indicators : (
      data[0] && data[0].scores ? Object.keys(data[0].scores).map(k => ({ name: k, max: 5 })) : []
    );
    return {
      textStyle: { fontFamily: 'inherit' },
      tooltip: { ...baseTooltip() },
      legend: { bottom: 0, itemWidth: 10, itemHeight: 10, icon: 'circle',
        textStyle: { color: '#57606a', fontSize: 11, fontFamily: 'inherit' }},
      radar: {
        indicator: inferred.map(i => typeof i === 'string' ? { name: i, max: 5 } : i),
        radius: '62%',
        axisName: { color: '#57606a', fontSize: 11, fontFamily: 'inherit' },
        splitLine: { lineStyle: { color: '#eaecef' }},
        splitArea: { areaStyle: { color: ['#ffffff', '#f6f7f9'] }},
        axisLine: { lineStyle: { color: '#d0d7de' }},
      },
      series: [{
        type: 'radar',
        data: data.map((p, i) => ({
          name: p.name || p.label || '',
          value: Array.isArray(p.value) ? p.value : inferred.map(ind => {
            const key = typeof ind === 'string' ? ind : ind.key || ind.name;
            return Number((p.scores || {})[key]) || 0;
          }),
          areaStyle: { opacity: i === 0 ? .16 : .06 },
          lineStyle: { width: i === 0 ? 2 : 1.5 },
        })),
      }],
      color: PALETTE,
    };
  };
  const buildFunnel = (data) => ({
    textStyle: { fontFamily: 'inherit' },
    tooltip: { ...baseTooltip(), trigger: 'item' },
    series: [{
      type: 'funnel',
      left: 'center', top: 12, bottom: 28, width: '74%',
      label: { color: '#1f2328', position: 'inside', fontSize: 12, fontFamily: 'inherit', formatter: '{b}\n{c}' },
      itemStyle: { borderColor: '#fff', borderWidth: 2 },
      data: data.map((p, i) => ({
        name: p.name || p.label || '',
        value: p.value ?? p.v ?? 0,
        itemStyle: { color: ['#2563eb', '#3b82f6', '#60a5fa', '#93c5fd', '#bfdbfe'][i % 5] },
      })),
    }],
  });
  const buildStackedBar = (ch) => {
    const categories = ch.categories || ch.x || [];
    const series = ch.series || [];
    return {
      textStyle: { fontFamily: 'inherit' },
      tooltip: { ...baseTooltip(), trigger: 'axis', axisPointer: { type: 'shadow' }},
      legend: { top: 0, itemWidth: 10, itemHeight: 10, icon: 'circle',
        textStyle: { color: '#57606a', fontSize: 11, fontFamily: 'inherit' }},
      grid: { left: 32, right: 20, top: 42, bottom: 30, containLabel: true },
      xAxis: { type: 'category', data: categories, ...baseAxis() },
      yAxis: { type: 'value', ...baseAxis() },
      series: series.map((s, i) => ({
        name: s.name,
        type: 'bar',
        stack: 'total',
        data: s.data || s.values || [],
        itemStyle: { color: PALETTE[i % PALETTE.length], borderRadius: i === series.length - 1 ? [4, 4, 0, 0] : 0 },
      })),
    };
  };
  const buildChart = (ch) => {
    const data = ch.data || [];
    switch (ch.type) {
      case 'line':  return buildLine(data);
      case 'donut':
      case 'pie':   return buildDonut(data, ch.tooltip_fmt);
      case 'bar-v':
      case 'bar':   return buildBarV(data, ch.axis_label_fmt, ch.tooltip_fmt);
      case 'bar-h': return buildBarH(data, ch.label_fmt, ch.target_value, ch.target_label);
      case 'scatter': return buildScatter(data, ch.x_name || ch.x_label, ch.y_name || ch.y_label);
      case 'radar':   return buildRadar(data, ch.indicators);
      case 'funnel':  return buildFunnel(data);
      case 'stacked-bar':
      case 'stacked_bar': return buildStackedBar(ch);
      default:      return buildBarV(data);
    }
  };

  /* ───────────────────────────────────────────────────
   * MINI MARKDOWN RENDERER（narrative / callout body 用）
   * 支持：H2-H4, **bold**, *italic*, `code`, [text](url), ul/ol,
   *      > blockquote, ---, paragraph, ::: cols-2/cols-3 ... :::
   * ─────────────────────────────────────────────────── */
  const renderMd = (raw) => {
    if (!raw) return '';
    if (typeof raw !== 'string') raw = String(raw);
    const inline = (s) => esc(s)
      .replace(/`([^`]+)`/g, (_, c) => '<code>' + c + '</code>')
      .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
      .replace(/\*([^*]+)\*/g, '<em>$1</em>')
      .replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
    const renderCols = (cls, inner) => {
      const panels = [];
      let cur = null;
      inner.trim().split('\n').forEach(line => {
        const m = line.match(/^####\s+(.+)$/);
        if (m) {
          cur = { title: m[1], body: [] };
          panels.push(cur);
        } else if (cur) {
          cur.body.push(line);
        }
      });
      if (!panels.length) return '<div class="' + cls + '">' + renderMd(inner) + '</div>';
      return '<div class="' + cls + '">' + panels.map(p =>
        '<div class="md-panel"><h4>' + inline(p.title) + '</h4>' +
        renderMd(p.body.join('\n').trim()) + '</div>'
      ).join('') + '</div>';
    };
    // ::: cols-N ... ::: -> <div class="cols-N"><div class="md-panel">...</div></div>
    raw = raw.replace(/:::\s*(cols-[23])\s*\n([\s\S]*?):::\s*/g,
      (_, cls, inner) => '\n\n' + renderCols(cls, inner) + '\n\n');

    // 简单 block 解析：按空行 split
    const blocks = raw.split(/\n\s*\n/);
    const out = [];
    const renderBlock = (blk) => {
      blk = blk.trim();
      if (!blk) return;
      if (blk.startsWith('<div class="cols-')) { out.push(blk); return; }
      // Heading - 首行是 ## / ### / ####，剩余行递归处理
      const hMatch = blk.match(/^(#{2,4})\s+(.+?)(\n([\s\S]*))?$/);
      if (hMatch) {
        const lv = hMatch[1].length;
        out.push('<h' + lv + '>' + inline(hMatch[2]) + '</h' + lv + '>');
        if (hMatch[4]) renderBlock(hMatch[4]);
        return;
      }
      if (blk === '---' || blk === '***') { out.push('<hr>'); return; }
      const lines = blk.split('\n');
      if (lines.every(l => l.startsWith('>'))) {
        out.push('<blockquote>' + inline(lines.map(l => l.replace(/^>\s?/, '')).join(' ')) + '</blockquote>');
        return;
      }
      if (lines.every(l => /^\s*[-*]\s+/.test(l))) {
        out.push('<ul>' + lines.map(l => '<li>' + inline(l.replace(/^\s*[-*]\s+/, '')) + '</li>').join('') + '</ul>');
        return;
      }
      if (lines.every(l => /^\s*\d+\.\s+/.test(l))) {
        out.push('<ol>' + lines.map(l => '<li>' + inline(l.replace(/^\s*\d+\.\s+/, '')) + '</li>').join('') + '</ol>');
        return;
      }
      out.push('<p>' + inline(blk.replace(/\n/g, ' ')) + '</p>');
    };
    blocks.forEach(renderBlock);
    return out.join('\n');
  };

  // chart_grid 渲染时把 ID + option 塞进来，DOM append 完后批量 init
  const ctx_pendingCharts = [];

  /* ───────────────────────────────────────────────────
   * BLOCK RENDERERS — 每个返回 HTMLElement (或 null)
   * 接收 (block, ctx)，block.type 决定走哪个分支
   * ─────────────────────────────────────────────────── */
  const headEl = (title, lede) => {
    if (!title && !lede) return '';
    return '<div class="section-head">' +
      (title ? '<h2>' + esc(title) + '</h2>' : '') +
      (lede  ? '<div class="lede">' + esc(lede) + '</div>' : '') +
    '</div>';
  };

  const renderers = {
    /* ─ kpi_row ───────────────────
       payload: { kpis: [{label, value, delta?, deltaDir?='up'|'down', tone?='brand'|'good'|'warn'|'bad', size?='lg'|'xl', trend?='up'|'down'|'flat'}] }  */
    kpi_row(b) {
      const kpis = b.kpis || b.items || [];
      if (!kpis.length) return null;
      const el = document.createElement('section');
      el.className = 'kpi-row';
      kpis.forEach(k => {
        const c = document.createElement('div');
        const classes = ['kpi-card'];
        if (k.tone) classes.push('tone-' + esc(k.tone));
        if (k.size) classes.push('size-' + esc(k.size));
        c.className = classes.join(' ');
        const trendHtml = k.trend ? '<span class="trend ' + esc(k.trend) + '"></span>' : '';
        c.innerHTML =
          '<div class="label">' + esc(k.label) + '</div>' +
          '<div class="value">' + trendHtml + esc(k.value) + '</div>' +
          (k.delta ? '<div class="delta ' + esc(k.deltaDir || '') + '">' + esc(k.delta) + '</div>' : '');
        el.appendChild(c);
      });
      return el;
    },

    /* ─ narrative ────────────────
       payload: { title?, lede?, body }  // body 是 markdown 字符串  */
    narrative(b) {
      const body = b.body || b.markdown || b.content || '';
      if (!body && !b.title) return null;
      const el = document.createElement('section');
      el.className = 'narrative';
      el.innerHTML =
        (b.title ? '<h2>' + esc(b.title) + '</h2>' : '') +
        (b.lede  ? '<div class="lede">' + esc(b.lede) + '</div>' : '') +
        '<div class="md">' + renderMd(body) + '</div>';
      return el;
    },

    /* ─ callout ──────────────────
       payload: { tone? = 'info'|'success'|'warn'|'danger', title?, body }  */
    callout(b) {
      const tone = b.tone || 'info';
      const body = b.body || b.content || '';
      if (!body && !b.title) return null;
      const icon = ({ info: 'ℹ️', success: '✅', warn: '⚠️', danger: '🚨' })[tone] || '';
      const el = document.createElement('div');
      el.className = 'callout ' + tone;
      el.innerHTML =
        (b.title ? '<div class="callout-title">' + (b.icon || icon) + ' ' + esc(b.title) + '</div>' : '') +
        (body    ? '<div class="callout-body">' + renderMd(body) + '</div>' : '');
      return el;
    },

    /* ─ divider ──────────────────
       payload: { label? }  */
    divider(b) {
      const el = document.createElement('div');
      el.innerHTML = '<hr class="block-divider">' +
        (b.label ? '<span class="block-divider-label">' + esc(b.label) + '</span>' : '');
      return el;
    },

    /* ─ directions ───────────────
       payload: { title?, lede?, items: [{name|title, features?, audience?, competitor?, reason?|summary?, is_pick?}] }  */
    directions(b) {
      const items = b.items || b.directions || [];
      if (!items.length) return null;
      const el = document.createElement('section');
      el.className = 'section';
      const inner = ['<div class="card-grid">'];
      items.forEach(d => {
        const isPick = d.is_pick || d.isPick || d.recommended || false;
        const name = d.name || d.title || d.label || '';
        const features = d.features || d.points || d.bullets || d.items || [];
        const badge = d.badge || (isPick ? '推荐' : '');
        const reason = d.reason || d.summary || d.detail || '';
        inner.push(
          '<div class="dir-card' + (isPick ? ' is-pick' : '') + '">' +
            (badge ? '<span class="badge">' + esc(badge) + '</span>' : '') +
            '<h3>' + esc(name) + '</h3>' +
            ((features && features.length) ? '<div class="features">' + features.map(f => '<span>' + esc(f) + '</span>').join('') + '</div>' : '') +
            (d.audience   ? '<div class="meta"><span class="meta-label">人群</span>' + esc(d.audience) + '</div>' : '') +
            (d.competitor ? '<div class="meta"><span class="meta-label">竞品</span>' + esc(d.competitor) + '</div>' : '') +
            (d.price_band ? '<div class="meta"><span class="meta-label">价格</span>' + esc(d.price_band) + '</div>' : '') +
            (d.cap        ? '<div class="meta"><span class="meta-label">上限</span>' + esc(d.cap) + '</div>' : '') +
            (reason       ? '<div class="reason">' + renderMd(reason) + '</div>' : '') +
          '</div>'
        );
      });
      inner.push('</div>');
      el.innerHTML = headEl(b.title || '战略方向选择', b.lede || '') + inner.join('');
      return el;
    },

    /* ─ chart_grid ───────────────
       payload: { title?, lede?, cols? = 1|2|3, charts: [{id?, title, type, data, options?}] }  */
    chart_grid(b) {
      const items = (b.charts || b.items || []).filter(c => {
        if (c.type === 'stacked-bar' || c.type === 'stacked_bar') return (c.series || []).length;
        return c.data && (!Array.isArray(c.data) || c.data.length);
      });
      if (!items.length) return null;
      const cols = b.cols || (items.length === 1 ? 1 : 2);
      const colClass = cols === 3 ? 'three-col' : cols === 2 ? 'two-col' : '';
      const el = document.createElement('section');
      el.className = 'section';
      const rows = [];
      let curRow = null;
      items.forEach((ch, idx) => {
        if (idx % cols === 0) {
          curRow = '<div class="chart-row ' + colClass + '"' + (idx > 0 ? ' style="margin-top:16px;"' : '') + '>';
          rows.push({ open: curRow, cells: [] });
        }
        const chartId = ch.id || ('chart-blk-' + Math.random().toString(36).slice(2, 9));
        ch._renderId = chartId;
        rows[rows.length - 1].cells.push(
          '<div class="chart-cell"><h4>' + esc(ch.title || '') + '</h4>' +
          '<div id="' + chartId + '" class="chart"></div></div>'
        );
      });
      el.innerHTML = headEl(b.title || '核心数据可视化', b.lede || '') +
        rows.map(r => r.open + r.cells.join('') + '</div>').join('');
      // 异步 init（DOM 进入文档后）
      ctx_pendingCharts.push(...items.map(ch => ({ id: ch._renderId, opt: Object.assign({}, buildChart(ch), ch.options || {}) })));
      return el;
    },

    /* ─ matrix_table ─────────────
       payload: { title?, lede?, columns?: [{key,label}], rows: [{dim, [colKey]: {text, tone?}, conclusion?}] }  */
    matrix_table(b) {
      const rows = b.rows || b.matrix || [];
      if (!rows.length) return null;
      let cols = b.columns || b.matrix_columns;
      if (!cols || !cols.length) {
        cols = Object.keys(rows[0]).filter(k => !['dim','dimension','name','label','conclusion','summary','note','is_winner'].includes(k))
          .map(k => ({ key: k, label: k }));
      } else {
        cols = cols.map(c => typeof c === 'string' ? { key: c, label: c } : c);
      }
      const cellHtml = (c) => {
        if (c == null || c === '') return '<td>—</td>';
        if (typeof c === 'object') return '<td><span class="tag ' + esc(c.tone || 'neutral') + '">' + esc(c.text != null ? c.text : '') + '</span></td>';
        return '<td><span class="tag neutral">' + esc(String(c)) + '</span></td>';
      };
      const el = document.createElement('section');
      el.className = 'section';
      el.innerHTML = headEl(b.title || '关键指标矩阵', b.lede || '逐维度横向对比 · ★ 行 = 关键胜出维度') +
        '<div class="table-wrap"><table>' +
          '<thead><tr><th>维度</th>' + cols.map(c => '<th>' + esc(c.label) + '</th>').join('') + '<th>结论</th></tr></thead>' +
          '<tbody>' +
            rows.map(r => {
              const dim = r.dim || r.dimension || r.name || r.label || '';
              const concl = r.conclusion || r.summary || r.note || '';
              const cls = r.is_winner ? ' class="is-winner"' : '';
              return '<tr' + cls + '><td><strong>' + esc(dim) + '</strong></td>' +
                cols.map(c => cellHtml(r[c.key])).join('') +
                '<td class="conclusion">' + esc(concl) + '</td></tr>';
            }).join('') +
          '</tbody>' +
        '</table></div>';
      return el;
    },

    /* ─ insight_stack ────────────
       payload: { title?, lede?, items: [{title, finding?, evidence?, meaning?|implication?, action?|recommendation?, confidence?, tone?}] } */
    insight_stack(b) {
      const items = b.items || b.insights || [];
      if (!items.length) return null;
      const el = document.createElement('section');
      el.className = 'section';
      const cards = items.map(it => {
        const title = it.title || it.name || it.finding || '';
        const meaning = it.meaning || it.implication || it.so_what || '';
        const action = it.action || it.recommendation || it.next_step || '';
        return '<div class="insight-card' + (it.tone ? ' tone-' + esc(it.tone) : '') + '">' +
          '<div class="insight-top">' +
            '<h3>' + esc(title) + '</h3>' +
            (it.confidence ? '<span class="confidence">' + esc(it.confidence) + '</span>' : '') +
          '</div>' +
          '<dl>' +
            (it.finding && it.finding !== title ? '<dt>发现</dt><dd>' + renderMd(it.finding) + '</dd>' : '') +
            (it.evidence ? '<dt>证据</dt><dd>' + renderMd(it.evidence) + '</dd>' : '') +
            (meaning ? '<dt>含义</dt><dd>' + renderMd(meaning) + '</dd>' : '') +
            (action ? '<dt>动作</dt><dd>' + renderMd(action) + '</dd>' : '') +
            (it.source ? '<dt>来源</dt><dd>' + esc(it.source) + '</dd>' : '') +
          '</dl>' +
        '</div>';
      }).join('');
      el.innerHTML = headEl(b.title || '关键洞察', b.lede || '按发现、证据、含义、动作组织') +
        '<div class="insight-stack">' + cards + '</div>';
      return el;
    },

    /* ─ scorecard ────────────────
       payload: { title?, lede?, criteria: [{key,label,weight?,max?}], items: [{name,scores:{key:number},note?}] } */
    scorecard(b) {
      const criteria = (b.criteria || b.columns || []).map(c => typeof c === 'string' ? { key: c, label: c, weight: 1, max: 5 } : c);
      const items = b.items || b.options || b.rows || [];
      if (!criteria.length || !items.length) return null;
      const scoreItem = (it) => {
        const scores = it.scores || it;
        let got = 0, max = 0;
        criteria.forEach(c => {
          const weight = Number(c.weight == null ? 1 : c.weight);
          const top = Number(c.max == null ? 5 : c.max);
          got += (Number(scores[c.key]) || 0) * weight;
          max += top * weight;
        });
        const pct = max ? Math.round(got / max * 100) : 0;
        return { it, pct, got, max };
      };
      const ranked = items.map(scoreItem).sort((a, b2) => b2.pct - a.pct);
      const scoreTone = v => v >= 4 ? 'good' : v >= 3 ? 'warn' : 'bad';
      const starHtml = (v, max = 5) => {
        const filled = Math.max(0, Math.min(max, Math.round(Number(v) || 0)));
        const tone = scoreTone(filled);
        let s = '<span class="score-stars tone-' + tone + '" aria-label="' + filled + ' / ' + max + '">';
        for (let i = 1; i <= max; i++) s += '<span class="' + (i <= filled ? 'on' : 'off') + '">★</span>';
        return s + '</span>';
      };
      const el = document.createElement('section');
      el.className = 'section';
      el.innerHTML = headEl(b.title || '加权评分卡', b.lede || '权重可按任务调整，最高分自动置顶') +
        '<div class="table-wrap"><table>' +
          '<thead><tr><th>方案</th>' +
            criteria.map(c => '<th>' + esc(c.label || c.key) + (c.weight ? ' <span style="color:var(--text-3);font-weight:400;">×' + esc(c.weight) + '</span>' : '') + '</th>').join('') +
            '<th>总分</th><th>备注</th></tr></thead>' +
          '<tbody>' +
            ranked.map((row, idx) => {
              const it = row.it;
              const scores = it.scores || it;
              const cls = idx === 0 ? ' class="score-winner"' : '';
              return '<tr' + cls + '><td><span class="score-rank">' + (idx + 1) + '</span><strong>' + esc(it.name || it.title || it.label || '') + '</strong></td>' +
                criteria.map(c => {
                  const v = Number(scores[c.key]) || 0;
                  return '<td>' + starHtml(v, Number(c.max == null ? 5 : c.max)) + '</td>';
                }).join('') +
                '<td><strong>' + row.pct + '%</strong><span class="score-bar"><span style="width:' + row.pct + '%"></span></span></td>' +
                '<td class="note">' + esc(it.note || it.reason || it.summary || '') + '</td></tr>';
            }).join('') +
          '</tbody></table></div>';
      return el;
    },

    /* ─ risk_map ─────────────────
       payload: { title?, lede?, items: [{title, impact:1-5|'high', likelihood:1-5|'high', mitigation?, tone?}] } */
    risk_map(b) {
      const items = b.items || b.risks || b.opportunities || [];
      if (!items.length) return null;
      const isHigh = (v) => typeof v === 'string' ? /high|高|大|强/i.test(v) : Number(v) >= 4;
      const bucket = (it) => (isHigh(it.impact) ? 'hi' : 'lo') + '-' + (isHigh(it.likelihood || it.probability) ? 'hi' : 'lo');
      const labels = {
        'hi-hi': '高影响 / 高概率',
        'hi-lo': '高影响 / 低概率',
        'lo-hi': '低影响 / 高概率',
        'lo-lo': '低影响 / 低概率',
      };
      const order = ['hi-hi', 'hi-lo', 'lo-hi', 'lo-lo'];
      const el = document.createElement('section');
      el.className = 'section';
      el.innerHTML = headEl(b.title || '风险与机会地图', b.lede || '按影响和概率拆分优先级') +
        '<div class="risk-map">' +
          order.map(key => {
            const cards = items.filter(it => bucket(it) === key).map(it => {
              const tone = it.tone || (key === 'hi-hi' ? 'bad' : key === 'hi-lo' ? 'warn' : 'neutral');
              const detail = it.detail || it.description || it.mitigation || it.action || '';
              return '<div class="risk-item tone-' + esc(tone) + '">' +
                '<div class="risk-title"><span>' + esc(it.title || it.name || '') + '</span>' +
                  (it.owner ? '<span class="tag neutral">@' + esc(it.owner) + '</span>' : '') +
                '</div>' +
                (detail ? '<p>' + renderMd(detail) + '</p>' : '') +
              '</div>';
            }).join('');
            return '<div class="risk-quadrant"><h3>' + labels[key] + '</h3>' + (cards || '<p style="color:var(--text-3);font-size:12px;">暂无</p>') + '</div>';
          }).join('') +
        '</div>';
      return el;
    },

    /* ─ roadmap ─────────────────
       payload: { title?, lede?, items: [{period|date, title, detail?, owner?, status?, metric?}] } */
    roadmap(b) {
      const items = b.items || b.steps || b.phases || [];
      if (!items.length) return null;
      const el = document.createElement('section');
      el.className = 'section';
      const steps = items.map((it, idx) =>
        '<div class="roadmap-step">' +
          '<div class="period">' + esc(it.period || it.date || it.when || ('Step ' + (idx + 1))) + '</div>' +
          '<h3>' + esc(it.title || it.name || '') + '</h3>' +
          (it.detail || it.description ? '<p>' + renderMd(it.detail || it.description) + '</p>' : '') +
          '<div class="roadmap-meta">' +
            (it.owner ? '<span class="tag neutral">@' + esc(it.owner) + '</span>' : '') +
            (it.status ? '<span class="tag ' + esc(it.tone || 'brand') + '">' + esc(it.status) + '</span>' : '') +
            (it.metric ? '<span class="tag good">' + esc(it.metric) + '</span>' : '') +
          '</div>' +
        '</div>'
      ).join('');
      el.innerHTML = headEl(b.title || '行动路线图', b.lede || '按阶段推进，不强制固定时间窗') +
        '<div class="roadmap">' + steps + '</div>';
      return el;
    },

    /* ─ source_notes ─────────────
       payload: { title?, lede?, items: [{source|title, note|detail, asof?, coverage?, confidence?, gap?}] } */
    source_notes(b) {
      const items = b.items || b.notes || b.sources || [];
      if (!items.length) return null;
      const el = document.createElement('section');
      el.className = 'section';
      const notes = items.map(n => {
        const title = n.source || n.title || n.name || '数据说明';
        const body = n.note || n.detail || n.description || n.gap || '';
        return '<div class="source-note">' +
          '<h3>' + esc(title) + '</h3>' +
          (body ? '<p>' + renderMd(body) + '</p>' : '') +
          '<div class="note-meta">' +
            (n.asof ? '<span class="tag neutral">' + esc(n.asof) + '</span>' : '') +
            (n.coverage ? '<span class="tag brand">' + esc(n.coverage) + '</span>' : '') +
            (n.confidence ? '<span class="tag good">' + esc(n.confidence) + '</span>' : '') +
            (n.gap && body !== n.gap ? '<span class="tag warn">' + esc(n.gap) + '</span>' : '') +
          '</div>' +
        '</div>';
      }).join('');
      el.innerHTML = headEl(b.title || '数据口径与缺口', b.lede || '把来源、覆盖范围、缺失项讲清楚') +
        '<div class="source-notes">' + notes + '</div>';
      return el;
    },

    /* ─ product_grid (Amazon) ────
       payload: { title?, lede?, items: [{asin, image_url, image_url_fallback?, title, brand, price, bsr_rank?, rating, ratings_count, category_path?, monthly_sales?, fulfillment?, available_date?, source?, asin_url?, badges?, highlight?, gap?}] }
       自动高亮：最高月销加皇冠 + 高亮月销标签；最高评分加橙色星；最低价加绿色价格  */
    product_grid(b) {
      const items = b.items || b.products || [];
      if (!items.length) return null;
      const el = document.createElement('section');
      el.className = 'section';
      const fmtNum = n => {
        if (n == null) return '—';
        if (n >= 1000000) return (n / 1000000).toFixed(1) + 'M';
        if (n >= 1000) return (n / 1000).toFixed(1) + 'k';
        return String(n);
      };
      // ── 数据对比：扫一遍找出 max/min，用于自动高亮（>=3 个 product 才启用，避免噪音） ──
      const salesArr  = items.map(p => Number(p.monthly_sales) || 0).filter(v => v > 0);
      const ratingArr = items.map(p => Number(p.rating || p.stars || p.star_rating) || 0).filter(v => v > 0);
      const priceArr  = items.map(p => Number(p.price) || 0).filter(v => v > 0);
      const enableHL = items.length >= 3;
      const maxSales  = enableHL && salesArr.length  ? Math.max(...salesArr)  : null;
      const maxRating = enableHL && ratingArr.length ? Math.max(...ratingArr) : null;
      const minPrice  = enableHL && priceArr.length  ? Math.min(...priceArr)  : null;

      const cards = items.map((p, idx) => {
        const rating = Number(p.rating || p.stars || p.star_rating) || 0;
        const rawCount = p.ratings_count ?? p.reviews ?? p.review_count ?? p.rating_count;
        const ratingsCount = rawCount != null ? Number(rawCount) : null;
        const filledPct = Math.max(0, Math.min(1, rating / 5)) * 100;
        const price = Number(p.price) || 0;
        const sales = Number(p.monthly_sales) || 0;
        const breadcrumbHtml = (p.category_path || '')
          .split(/[>›:|/]/).map(s => s.trim()).filter(Boolean)
          .map((part, i, arr) => esc(part) + (i < arr.length - 1 ? '<span class="sep">›</span>' : '')).join('');
        const badgesHtml = (p.badges || []).map(bd =>
          '<span class="badge-amz ' + esc(bd) + '">' + esc(({
            'best-seller': 'Best Seller', 'amazon-choice': "Amazon's Choice", 'new-release': 'New Release',
          })[bd] || bd) + '</span>'
        ).join('');
        // Amazon 跳转：只让图上的 CTA 按钮跳转，卡片本身保留文本可复制
        const cardHref = p.asin_url || (p.asin ? 'https://www.amazon.com/dp/' + p.asin : '');
        const imgFallbacks = [p.image_url, p.image_url_fallback].filter(Boolean);
        const imgHtml = imgFallbacks.length
          ? '<img src="' + esc(imgFallbacks[0]) + '" alt="" loading="lazy" referrerpolicy="no-referrer" ' +
            'data-srcs=\'' + JSON.stringify(imgFallbacks).replace(/\'/g, '&#39;') + '\' data-attempt="0" ' +
            'onerror="(function(img){var s=JSON.parse(img.getAttribute(\'data-srcs\'));var n=Number(img.getAttribute(\'data-attempt\'))+1;if(n<s.length){img.setAttribute(\'data-attempt\',n);img.src=s[n]}else{img.style.display=\'none\'}})(this)">'
          : '';
        // 亮点 / 缺点（agent 自由写）
        const insightHtml = (p.highlight || p.gap) ?
          '<div class="meta-row" style="margin-top:4px;flex-direction:column;align-items:stretch;gap:4px;">' +
            (p.highlight ? '<span style="background:var(--good-soft);color:var(--good);padding:4px 8px;border-radius:6px;font-size:12px;font-weight:500;line-height:1.4;">▲ ' + esc(p.highlight) + '</span>' : '') +
            (p.gap       ? '<span style="background:var(--bad-soft);color:var(--bad);padding:4px 8px;border-radius:6px;font-size:12px;font-weight:500;line-height:1.4;">▼ ' + esc(p.gap) + '</span>' : '') +
          '</div>' : '';
        // 自动高亮 class
        const hlClasses = [
          (maxSales  && sales  === maxSales)  ? 'has-best-sales'  : '',
          (maxRating && rating === maxRating) ? 'has-best-rating' : '',
          (minPrice  && price  === minPrice)  ? 'has-best-price'  : '',
        ].filter(Boolean).join(' ');
        return '<div class="product-card ' + hlClasses + '">' +
          (hlClasses.includes('has-best-sales') ? '<div class="crown" title="月销榜首">👑</div>' : '') +
          '<div class="img-wrap">' +
            '<span class="placeholder">📦</span>' +
            '<div class="rank">#' + (idx + 1) + '</div>' +
            (badgesHtml ? '<div class="badges">' + badgesHtml + '</div>' : '') +
            imgHtml +
            (cardHref ? '<a class="amz-cta" href="' + esc(cardHref) + '" target="_blank" rel="noopener" aria-label="打开 Amazon：' + esc(p.title || p.asin || '') + '"><span class="amz-cta-icon">↗</span><span>Amazon</span></a>' : '') +
          '</div>' +
          (p.brand ? '<div class="brand">' + esc(p.brand) + '</div>' : '') +
          '<div class="title">' + esc(p.title || p.asin || '') + '</div>' +
          '<div class="price-row">' +
            '<div class="price">' + (p.price != null ? '$' + Number(p.price).toFixed(2) : '—') + '</div>' +
            (p.bsr_rank ? '<div class="bsr">BSR #' + Number(p.bsr_rank).toLocaleString() + '</div>' : '') +
          '</div>' +
          '<div class="stars">' +
            '<span class="star-svg">' +
              '<span class="empty" style="width:80px"></span>' +
              '<span class="filled" style="width:' + (80 * filledPct / 100) + 'px"></span>' +
            '</span>' +
            '<span>' + (rating ? rating.toFixed(1) : '—') +
            (ratingsCount != null ? ' · ' + ratingsCount.toLocaleString() + ' 评论' : '') + '</span>' +
          '</div>' +
          (breadcrumbHtml ? '<div class="breadcrumb">' + breadcrumbHtml + '</div>' : '') +
          '<div class="meta-row">' +
            (p.monthly_sales ? '<span class="monthly-sales">月销 ' + fmtNum(p.monthly_sales) + '</span>' : '') +
            (p.fulfillment ? '<span>' + esc(p.fulfillment) + '</span>' : '') +
            (p.available_date ? '<span>上架 ' + esc(p.available_date.slice(0,7)) + '</span>' : '') +
            (p.source ? '<span>' + esc(p.source) + '</span>' : '') +
          '</div>' +
          insightHtml +
        '</div>';
      }).join('');
      el.innerHTML = headEl(b.title || 'TOP 商品矩阵', b.lede || '悬停商品图后点击 Amazon 按钮跳转 · 👑 月销榜首 · 橙色星 = 最高评分 · 绿色价 = 最低价') +
        '<div class="product-grid">' + cards + '</div>';
      return el;
    },

    /* ─ multisource ──────────────
       payload: { title?, lede?, sources?: ['ss','justone','sorftime','keepa'|...], rows: [{indicator, [src]: {value, asof?}, note?}] }
       sources 可省略，省略时用默认 4 源 ss/justone/sorftime/keepa  */
    multisource(b) {
      const rows = b.rows || [];
      if (!rows.length) return null;
      const labels = { ss: 'SellerSprite', justone: 'JustOneAPI', sorftime: 'Sorftime', keepa: 'Keepa' };
      const sources = b.sources || ['ss', 'justone', 'sorftime', 'keepa'];
      const cellHtml = (src) => {
        if (!src || src.value == null) return '<td class="source-col empty">—</td>';
        const v = typeof src.value === 'number' ? src.value.toLocaleString() : esc(String(src.value));
        const asof = src.asof ? '<span class="asof">' + esc(src.asof) + '</span>' : '';
        return '<td class="source-col">' + v + asof + '</td>';
      };
      const el = document.createElement('section');
      el.className = 'section';
      el.innerHTML = headEl(b.title || '多数据源对照', b.lede || '同一指标在不同源的数值差异 + 取舍解释') +
        '<div class="multisource-wrap"><table>' +
          '<thead><tr><th>指标</th>' +
            sources.map(s => '<th class="source-col">' + esc(labels[s] || s) + '</th>').join('') +
            '<th>差异说明 / 取舍</th></tr></thead>' +
          '<tbody>' +
            rows.map(r => '<tr><td><strong>' + esc(r.indicator) + '</strong></td>' +
              sources.map(s => cellHtml(r[s])).join('') +
              '<td class="note">' + esc(r.note || '') + '</td></tr>'
            ).join('') +
          '</tbody>' +
        '</table></div>';
      return el;
    },

    /* ─ decisions ────────────────
       payload: { title?, lede?, items: [{title|name, detail|description, when|window?, owner?, risk?}] }  */
    decisions(b) {
      const items = b.items || b.decisions || b.next_steps || b.actions || [];
      if (!items.length) return null;
      const el = document.createElement('section');
      el.className = 'section';
      el.innerHTML = headEl(b.title || '下一步行动', b.lede || '按时间窗排序') +
        '<div class="decisions">' +
          items.map((d, i) => {
            const t = d.title || d.name || d.label || d.action || '';
            const det = d.detail || d.description || d.summary || '';
            const w = d.when || d.window || d.timeline || d.deadline || '';
            const owner = d.owner ? '<span class="when" style="text-transform:none;">@' + esc(d.owner) + '</span>' : '';
            const risk = d.risk ? '<span class="when" style="background:var(--warn-soft);color:var(--warn);">风险 ' + esc(d.risk) + '</span>' : '';
            return '<div class="decision">' +
              '<div class="num">' + (i + 1) + '</div>' +
              '<div class="body">' +
                '<h4>' + esc(t) + '</h4>' +
                (det ? '<p>' + renderMd(det) + '</p>' : '') +
                (w ? '<div class="when">' + esc(w) + '</div> ' : '') + owner + ' ' + risk +
              '</div>' +
            '</div>';
          }).join('') +
        '</div>';
      return el;
    },

    /* ─ quote_wall ───────────────
       payload: { title?, lede?, items: [{text|quote, author?, source?, rating?, tone? = 'good'|'bad'|'warn'}] }  */
    quote_wall(b) {
      const items = b.items || b.quotes || [];
      if (!items.length) return null;
      const el = document.createElement('section');
      el.className = 'section';
      const cards = items.map(q => {
        const text = q.text || q.quote || q.body || '';
        const stars = q.rating ? '★'.repeat(Math.round(Number(q.rating))) + '☆'.repeat(5 - Math.round(Number(q.rating))) : '';
        return '<div class="quote-card' + (q.tone ? ' tone-' + esc(q.tone) : '') + '">' +
          '<div class="quote-text">' + esc(text) + '</div>' +
          '<div class="quote-meta">' +
            (q.author ? '<span class="author">' + esc(q.author) + '</span>' : '') +
            (stars   ? '<span class="quote-stars">' + stars + '</span>' : '') +
            (q.source ? '<span>· ' + esc(q.source) + '</span>' : '') +
          '</div>' +
        '</div>';
      }).join('');
      el.innerHTML = headEl(b.title || '买家心声', b.lede || '') +
        '<div class="quote-wall">' + cards + '</div>';
      return el;
    },

    /* ─ table ────────────────────
       通用表格 — payload: { title?, lede?, columns: [{key,label,align?}], rows: [obj] }  */
    table(b) {
      const cols = (b.columns || []).map(c => typeof c === 'string' ? { key: c, label: c } : c);
      const rows = b.rows || [];
      if (!cols.length || !rows.length) return null;
      const el = document.createElement('section');
      el.className = 'section';
      el.innerHTML = headEl(b.title, b.lede) +
        '<div class="table-wrap"><table>' +
          '<thead><tr>' + cols.map(c => '<th' + (c.align ? ' style="text-align:' + c.align + '"' : '') + '>' + esc(c.label) + '</th>').join('') + '</tr></thead>' +
          '<tbody>' + rows.map(r =>
            '<tr>' + cols.map(c => {
              const v = r[c.key];
              if (v == null) return '<td>—</td>';
              if (typeof v === 'object' && v.text != null) {
                return '<td><span class="tag ' + esc(v.tone || 'neutral') + '">' + esc(v.text) + '</span></td>';
              }
              return '<td' + (c.align ? ' style="text-align:' + c.align + '"' : '') + '>' + esc(String(v)) + '</td>';
            }).join('') + '</tr>'
          ).join('') + '</tbody>' +
        '</table></div>';
      return el;
    },

    /* ─ raw_html (escape hatch) ──
       payload: { html }  最后兜底；agent 极少用，主要给静态嵌入用  */
    raw_html(b) {
      if (!b.html) return null;
      const el = document.createElement('div');
      el.innerHTML = b.html;
      return el;
    },
  };

  /* ───────────────────────────────────────────────────
   * 旧 schema 兼容：D.kpis / D.directions / D.matrix /
   * D.products / D.multi_source / D.decisions /
   * D.monthly_sales / D.cost_breakdown / D.channel /
   * D.direction_caps / D.charts → 自动转 blocks 数组
   * ─────────────────────────────────────────────────── */
  const compatBlocks = () => {
    const out = [];
    if (D.kpis && D.kpis.length) out.push({ type: 'kpi_row', kpis: D.kpis });
    if ((D.directions || D.strategic_directions || []).length) {
      out.push({
        type: 'directions',
        title: D.directions_title || '战略方向选择',
        lede: D.directions_lede || '多个方向横向对比，推荐方向带高亮',
        items: D.directions || D.strategic_directions,
      });
    }
    // legacy 4 charts + dynamic charts → 合并成一个 chart_grid
    const legacyCharts = [];
    if (D.monthly_sales && D.monthly_sales.length) legacyCharts.push({ title: D.monthly_sales_title || '月度销量趋势', type: 'line',
      data: D.monthly_sales.map(p => ({ name: p.m ? p.m + '月' : p.name, value: p.v })) });
    if (D.cost_breakdown && D.cost_breakdown.length) legacyCharts.push({ title: D.cost_breakdown_title || '成本结构', type: 'donut', data: D.cost_breakdown });
    if (D.channel && D.channel.length) legacyCharts.push({ title: D.channel_title || '渠道分布', type: 'bar-v', data: D.channel, axis_label_fmt: '{value}%', tooltip_fmt: '{b}: {c}%' });
    if (D.direction_caps && D.direction_caps.length) legacyCharts.push({ title: D.direction_caps_title || '方向上限', type: 'bar-h', data: D.direction_caps, label_fmt: '{c} 万', target_value: 100, target_label: '目标 100 万' });
    const dynCharts = Array.isArray(D.charts) ? D.charts : [];
    const allCharts = [...legacyCharts, ...dynCharts];
    if (allCharts.length) {
      out.push({ type: 'chart_grid', title: D.charts_title || '核心数据可视化', lede: D.charts_lede || '按维度展开图表', cols: 2, charts: allCharts });
    }
    if ((D.matrix || []).length) {
      out.push({ type: 'matrix_table', title: D.matrix_title || '关键指标矩阵', lede: D.matrix_lede || '逐维度横向对比',
        columns: D.matrix_columns, rows: D.matrix });
    }
    if ((D.products || []).length) {
      out.push({ type: 'product_grid', title: D.products_title || 'TOP 商品矩阵', lede: D.products_lede || '缩略图 / 星级 / 价格 / 类目 / BSR / 月销 / 平台徽章', items: D.products });
    }
    if (D.multi_source && Array.isArray(D.multi_source.rows) && D.multi_source.rows.length) {
      out.push({ type: 'multisource', title: D.multi_source.title || '多数据源对照', sources: D.multi_source.sources, rows: D.multi_source.rows });
    }
    if ((D.decisions || D.next_steps || D.actions || []).length) {
      out.push({ type: 'decisions', title: D.decisions_title || '下一步行动', lede: D.decisions_lede || '按时间窗排序',
        items: D.decisions || D.next_steps || D.actions });
    }
    return out;
  };

  /* ───────────────────────────────────────────────────
   * RENDER：优先用 D.blocks，否则走兼容层 compatBlocks()
   * ─────────────────────────────────────────────────── */
  const root = $('blocks');
  const blocks = (Array.isArray(D.blocks) && D.blocks.length) ? D.blocks : compatBlocks();

  blocks.forEach(b => {
    if (!b || !b.type) return;
    const fn = renderers[b.type];
    if (!fn) {
      console.warn('[dashboard] unknown block type:', b.type);
      return;
    }
    try {
      const node = fn(b);
      if (node) root.appendChild(node);
    } catch (err) {
      console.error('[dashboard] block render failed:', b.type, err);
    }
  });

  // chart init 必须在 DOM append 完成后做（否则 echarts 拿不到尺寸）
  requestAnimationFrame(() => {
    ctx_pendingCharts.forEach(ch => initChart(ch.id, ch.opt));
  });
  window.addEventListener('resize', () => charts.forEach(c => c.resize()));
})();
</script>
</body>
</html>
